---
swagger: "2.0"
info:
  description: "Orders API - Architecture A (API Gateway mapping templates / non-proxy\
    \ integration)"
  version: "1.0"
  title: "orders-api-mapping"
host: "53zqfs5myi.execute-api.us-east-1.amazonaws.com"
basePath: "/prod"
schemes:
- "https"
paths:
  /orders:
    get:
      consumes:
      - "application/json"
      produces:
      - "application/json"
      parameters:
      - name: "customerId"
        in: "query"
        required: false
        type: "string"
      responses:
        "200":
          description: "200 response"
          schema:
            $ref: "#/definitions/OrderList"
        "400":
          description: "400 response"
          schema:
            $ref: "#/definitions/Error"
        "500":
          description: "500 response"
          schema:
            $ref: "#/definitions/Error"
      x-amazon-apigateway-integration:
        uri: "arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:416384710474:function:orders-find-direct/invocations"
        httpMethod: "POST"
        responses:
          default:
            statusCode: "200"
          (?s)(?!INVALID_ORDER:|MISSING_CUSTOMER_ID:|ORDER_NOT_FOUND:).+:
            statusCode: "500"
            responseTemplates:
              application/json: "{\"error\":\"INTERNAL_ERROR\",\"message\":\"Unexpected\
                \ error\"}"
          (?s)(INVALID_ORDER|MISSING_CUSTOMER_ID):.*:
            statusCode: "400"
            responseTemplates:
              application/json: "#set($raw = $input.path('$.errorMessage'))\n#set($idx\
                \ = $raw.indexOf(':'))\n#set($start = $idx + 2)\n{\n  \"error\": \"\
                $raw.substring(0, $idx)\",\n  \"message\": \"$util.escapeJavaScript($raw.substring($start))\"\
                \n}\n"
        requestTemplates:
          application/json: "{\n  \"customerId\": \"$util.escapeJavaScript($input.params('customerId'))\"\
            \n}\n"
        passthroughBehavior: "when_no_templates"
        type: "aws"
    post:
      consumes:
      - "application/json"
      produces:
      - "application/json"
      parameters:
      - in: "body"
        name: "CreateOrderRequest"
        required: true
        schema:
          $ref: "#/definitions/CreateOrderRequest"
      responses:
        "201":
          description: "201 response"
          schema:
            $ref: "#/definitions/Order"
          headers:
            Location:
              type: "string"
        "400":
          description: "400 response"
          schema:
            $ref: "#/definitions/Error"
        "500":
          description: "500 response"
          schema:
            $ref: "#/definitions/Error"
      x-amazon-apigateway-integration:
        uri: "arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:416384710474:function:orders-create-direct/invocations"
        httpMethod: "POST"
        responses:
          default:
            statusCode: "201"
            responseTemplates:
              application/json: "#set($context.responseOverride.header.Location =\
                \ \"/orders/$input.path('$.id')\")\n$input.json('$')\n"
          (?s)(?!INVALID_ORDER:|MISSING_CUSTOMER_ID:|ORDER_NOT_FOUND:).+:
            statusCode: "500"
            responseTemplates:
              application/json: "{\"error\":\"INTERNAL_ERROR\",\"message\":\"Unexpected\
                \ error\"}"
          (?s)(INVALID_ORDER|MISSING_CUSTOMER_ID):.*:
            statusCode: "400"
            responseTemplates:
              application/json: "#set($raw = $input.path('$.errorMessage'))\n#set($idx\
                \ = $raw.indexOf(':'))\n#set($start = $idx + 2)\n{\n  \"error\": \"\
                $raw.substring(0, $idx)\",\n  \"message\": \"$util.escapeJavaScript($raw.substring($start))\"\
                \n}\n"
        requestTemplates:
          application/json: "$input.json('$')"
        passthroughBehavior: "never"
        type: "aws"
  /orders/{id}:
    get:
      consumes:
      - "application/json"
      produces:
      - "application/json"
      parameters:
      - name: "id"
        in: "path"
        required: true
        type: "string"
      responses:
        "200":
          description: "200 response"
          schema:
            $ref: "#/definitions/Order"
        "500":
          description: "500 response"
          schema:
            $ref: "#/definitions/Error"
        "404":
          description: "404 response"
          schema:
            $ref: "#/definitions/Error"
      x-amazon-apigateway-integration:
        uri: "arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:416384710474:function:orders-get-direct/invocations"
        httpMethod: "POST"
        responses:
          default:
            statusCode: "200"
          (?s)ORDER_NOT_FOUND:.*:
            statusCode: "404"
            responseTemplates:
              application/json: "#set($raw = $input.path('$.errorMessage'))\n#set($start\
                \ = $raw.indexOf(':') + 2)\n{\n  \"error\": \"ORDER_NOT_FOUND\",\n\
                \  \"message\": \"$util.escapeJavaScript($raw.substring($start))\"\
                \n}\n"
          (?s)(?!INVALID_ORDER:|MISSING_CUSTOMER_ID:|ORDER_NOT_FOUND:).+:
            statusCode: "500"
            responseTemplates:
              application/json: "{\"error\":\"INTERNAL_ERROR\",\"message\":\"Unexpected\
                \ error\"}"
        requestTemplates:
          application/json: "{\n  \"id\": \"$util.escapeJavaScript($input.params('id'))\"\
            \n}\n"
        passthroughBehavior: "when_no_templates"
        type: "aws"
    delete:
      consumes:
      - "application/json"
      produces:
      - "application/json"
      parameters:
      - name: "id"
        in: "path"
        required: true
        type: "string"
      responses:
        "500":
          description: "500 response"
          schema:
            $ref: "#/definitions/Error"
        "204":
          description: "204 response"
        "404":
          description: "404 response"
          schema:
            $ref: "#/definitions/Error"
      x-amazon-apigateway-integration:
        uri: "arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:416384710474:function:orders-delete-direct/invocations"
        httpMethod: "POST"
        responses:
          default:
            statusCode: "204"
            responseTemplates:
              application/json: "#set($noBody = '')"
          (?s)ORDER_NOT_FOUND:.*:
            statusCode: "404"
            responseTemplates:
              application/json: "#set($raw = $input.path('$.errorMessage'))\n#set($start\
                \ = $raw.indexOf(':') + 2)\n{\n  \"error\": \"ORDER_NOT_FOUND\",\n\
                \  \"message\": \"$util.escapeJavaScript($raw.substring($start))\"\
                \n}\n"
          (?s)(?!INVALID_ORDER:|MISSING_CUSTOMER_ID:|ORDER_NOT_FOUND:).+:
            statusCode: "500"
            responseTemplates:
              application/json: "{\"error\":\"INTERNAL_ERROR\",\"message\":\"Unexpected\
                \ error\"}"
        requestTemplates:
          application/json: "{\n  \"id\": \"$util.escapeJavaScript($input.params('id'))\"\
            \n}\n"
        passthroughBehavior: "when_no_templates"
        type: "aws"
definitions:
  Order:
    type: "object"
    properties:
      id:
        type: "string"
      customerId:
        type: "string"
      product:
        type: "string"
      quantity:
        type: "integer"
  CreateOrderRequest:
    type: "object"
    properties:
      customerId:
        type: "string"
      product:
        type: "string"
      quantity:
        type: "integer"
  Error:
    type: "object"
    properties:
      error:
        type: "string"
      message:
        type: "string"
  OrderList:
    type: "array"
    items:
      $ref: "#/definitions/Order"
x-amazon-apigateway-security-policy: "TLS_1_0"
